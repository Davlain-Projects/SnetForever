name: Bug report
description: Report a reproducible problem in SnetForever.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/Davlain-Projects/SnetForever/issues) first.
        Use [private vulnerability reporting](https://github.com/Davlain-Projects/SnetForever/security/advisories/new) for security issues.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - In-game addon
        - Windows companion
        - Windows installer or updates
        - Guides or game data
        - Development tools
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the installed version, preview tag, or source commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the game client, Windows version, or tooling version relevant to the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove credentials, character names, and private guide content from logs and screenshots.
