name: Bug report
description: Report a reproducible problem in SnetForever.
body:
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - In-game addon
        - Windows companion
        - Windows installer or updates
        - Guides or game data
        - Development tools
        - Unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the installed version, preview tag, or source commit.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the relevant game client or Windows version and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove credentials, character names, and private guide content from logs and screenshots.
